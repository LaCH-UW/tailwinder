- id: tailwinder
  name: tailwinder
  description: "Run 'tailwinder' for automatic Tailwind CSS compilation"
  entry: tailwinder
  additional_dependencies:
    - tailwindcss@4.3.3
    - "@tailwindcss/cli@4.3.3"
  language: node
  language_version: 26.13.1 # Latest LTS
  always_run: true
  pass_filenames: false
  args: ["-i", "input.css", "-o", "tailwind.css"]
  require_serial: true
  minimum_pre_commit_version: "2.9.2"
